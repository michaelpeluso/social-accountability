name: Branch Protection

# Ensure newer runs cancel older ones for the same branch
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Run on all pushes and PRs to catch issues early
on:
  pull_request:
    branches: [main]
    paths-ignore: ['docs/**', 'design/**']
  push:
    paths-ignore: ['docs/**', 'design/**']

jobs:
  # Gate job that depends on all required checks (PRs only)
  protection-gate:
    name: All checks must pass
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [type-check, code-quality, test]
    steps:
      - name: All required checks passed
        run: echo "All required checks passed. Safe to merge."

  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run type-check

  code-quality:
    name: Code Quality (ESLint + Prettier)
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint
      - run: npm run format:check

  test:
    name: Jest Tests
    runs-on: ubuntu-latest
    env:
      HUSKY: 0
      TZ: UTC
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test -- --coverage
      - name: Upload coverage
        uses: codecov/codecov-action@v3
        if: ${{ secrets.CODECOV_TOKEN != '' }}
        continue-on-error: true
        with:
          files: ./coverage/lcov.info
          token: ${{ secrets.CODECOV_TOKEN }}
