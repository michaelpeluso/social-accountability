name: Branch Protection

# This workflow acts as a required status check gate for main branch
# Lightweight checks run on all pushes for early feedback
# Full gate only runs on PRs to main

on:
  pull_request:
    branches: [main]
  push:
    branches: ['**'] # Run lightweight checks on all pushes

jobs:
  # Gate job that depends on all required checks (PRs only)
  protection-gate:
    name: All checks must pass
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    needs: [type-check, lint, format-check, test]
    steps:
      - name: All required checks passed
        run: echo "✅ All required checks passed. Safe to merge."

  # Lightweight checks run on ALL pushes (early feedback: ~30s each)
  # Heavier checks run on PRs only (thorough validation: ~1-2min)
  type-check:
    name: TypeScript Type Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run type-check

  lint:
    name: ESLint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run lint

  format-check:
    name: Prettier Format Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm run format:check

  test:
    name: Jest Tests
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
      - run: npm ci
      - run: npm test -- --coverage
