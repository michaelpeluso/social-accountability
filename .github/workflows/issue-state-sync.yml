name: Issue State Sync

# Cancel older runs for same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Auto-update issue states and GitHub Projects status based on commit/PR activity
# - Move to "In Progress" when branch is pushed or PR opened
# - Move to "Done" and close issue when PR with "closes #X" merges
# - Gracefully handles branches without associated issues

on:
  pull_request:
    types: [opened, reopened, ready_for_review, closed]
    paths-ignore: ['docs/**', 'design/**']

jobs:
  sync-issue-state:
    runs-on: ubuntu-latest
    permissions:
      issues: write
      pull-requests: read
      contents: read
    
    steps:
      - name: Update issue status
        uses: actions/github-script@v7
        env:
          GH_TOKEN: ${{ secrets.SOCIAL_ACCOUNTABILITY_TOKEN }}
        with:
          github-token: ${{ secrets.SOCIAL_ACCOUNTABILITY_TOKEN }}
          script: |
            // Extract issue numbers from text (PR body, title, or commit message)
            function extractIssueNumbers(text) {
              if (!text) return [];
              const matches = text.match(/#(\d+)/g) || [];
              return matches.map(m => parseInt(m.substring(1)));
            }
            
            let issueNumbers = [];
            let action = null;
            
            // Handle PR events
            if (context.eventName === 'pull_request') {
              const pr = context.payload.pull_request;
              const prBody = pr.body || '';
              const prTitle = pr.title || '';
              
              issueNumbers = [
                ...extractIssueNumbers(prBody),
                ...extractIssueNumbers(prTitle)
              ];
              
              // PR opened/reopened: move to "In Progress"
              if (['opened', 'reopened', 'ready_for_review'].includes(context.payload.action)) {
                action = 'in-progress';
              }
              
              // PR merged with "closes/fixes/resolves": move to "Done" and close
              if (pr.merged && (prBody.match(/closes|fixes|resolves/i) || prTitle.match(/closes|fixes|resolves/i))) {
                action = 'done';
              }
            }
            
            // Handle push events (commits to feature branches)
            if (context.eventName === 'push') {
              const commits = context.payload.commits || [];
              const ref = context.payload.ref || '';
              
              // Extract issue from branch name (e.g., 123-add-form or 5-m0-01-project-setup)
              const branchMatch = ref.match(/(\d+)/);
              if (branchMatch) {
                issueNumbers.push(parseInt(branchMatch[1]));
              }
              
              // Also check commit messages
              for (const commit of commits) {
                issueNumbers.push(...extractIssueNumbers(commit.message));
              }
              
              // Pushes to feature branches: move to "In Progress"
              if (issueNumbers.length > 0 && !ref.includes('main') && !ref.includes('master')) {
                action = 'in-progress';
              }
            }
            
            // Remove duplicates
            issueNumbers = [...new Set(issueNumbers)];
            
            if (issueNumbers.length === 0) {
              console.log('ℹ️ No issue references found (this is OK for branches without issues)');
              return;
            }
            
            console.log(`Found issues: ${issueNumbers.join(', ')}`);
            console.log(`Action: ${action || 'none'}`);
            
            // Update each referenced issue
            for (const issueNumber of issueNumbers) {
              try {
                // Verify issue exists
                const issue = await github.rest.issues.get({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  issue_number: issueNumber
                });
                
                // Action: Mark as done and close issue
                if (action === 'done' && issue.data.state === 'open') {
                  await github.rest.issues.update({
                    owner: context.repo.owner,
                    repo: context.repo.repo,
                    issue_number: issueNumber,
                    state: 'closed'
                  });
                    console.log(`Closed issue #${issueNumber}`);
                  
                  // Move to "Done" on project board
                  try {
                    const projectItems = await github.graphql(`
                      query($issueId: ID!) {
                        node(id: $issueId) {
                          ... on Issue {
                            projectItems(first: 10) {
                              nodes {
                                id
                                project {
                                  id
                                }
                              }
                            }
                          }
                        }
                      }
                    `, { issueId: issue.data.node_id });
                    
                    const projectItem = projectItems.node.projectItems.nodes.find(
                      item => item.project.id === 'PVT_kwHOBZ18Zs4BLqdH'
                    );
                    
                    if (projectItem) {
                      await github.graphql(`
                        mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $valueId: String!) {
                          updateProjectV2ItemFieldValue(input: {
                            projectId: $projectId
                            itemId: $itemId
                            fieldId: $fieldId
                            value: { singleSelectOptionId: $valueId }
                          }) {
                            projectV2Item { id }
                          }
                        }
                      `, {
                        projectId: 'PVT_kwHOBZ18Zs4BLqdH',
                        itemId: projectItem.id,
                        fieldId: 'PVTSSF_lAHOBZ18Zs4BLqdHzg7K3SQ',
                        valueId: '98236657'
                      });
                      console.log(`📊 Moved #${issueNumber} to "Done" on project board`);
                    }
                  } catch (projectError) {
                    console.log(`⚠️ Could not update project status: ${projectError.message}`);
                  }
                }
                
                // Action: Add in-progress label
                if (action === 'in-progress') {
                  const labels = issue.data.labels.map(l => l.name);
                  
                  if (!labels.includes('in-progress')) {
                    await github.rest.issues.addLabels({
                      owner: context.repo.owner,
                      repo: context.repo.repo,
                      issue_number: issueNumber,
                      labels: ['in-progress']
                    });
                    console.log(`🏃 Added "in-progress" label to #${issueNumber}`);
                  }
                  
                  // Move to "In Progress" on project board
                  try {
                    const projectItems = await github.graphql(`
                      query($issueId: ID!) {
                        node(id: $issueId) {
                          ... on Issue {
                            projectItems(first: 10) {
                              nodes {
                                id
                                project {
                                  id
                                }
                              }
                            }
                          }
                        }
                      }
                    `, { issueId: issue.data.node_id });
                    
                    const projectItem = projectItems.node.projectItems.nodes.find(
                      item => item.project.id === 'PVT_kwHOBZ18Zs4BLqdH'
                    );
                    
                    if (projectItem) {
                      await github.graphql(`
                        mutation($projectId: ID!, $itemId: ID!, $fieldId: ID!, $valueId: String!) {
                          updateProjectV2ItemFieldValue(input: {
                            projectId: $projectId
                            itemId: $itemId
                            fieldId: $fieldId
                            value: { singleSelectOptionId: $valueId }
                          }) {
                            projectV2Item { id }
                          }
                        }
                      `, {
                        projectId: 'PVT_kwHOBZ18Zs4BLqdH',
                        itemId: projectItem.id,
                        fieldId: 'PVTSSF_lAHOBZ18Zs4BLqdHzg7K3SQ',
                        valueId: '47fc9ee4'
                      });
                      console.log(`📊 Moved #${issueNumber} to "In Progress" on project board`);
                    }
                  } catch (projectError) {
                    console.log(`⚠️ Could not update project status: ${projectError.message}`);
                  }
                }
                
              } catch (error) {
                // Issue doesn't exist - this is OK, not all branches have issues
                if (error.status === 404) {
                  console.log(`ℹ️ Issue #${issueNumber} not found (branch may not have an associated issue)`);
                } else {
                  console.error(`❌ Failed to update issue #${issueNumber}: ${error.message}`);
                }
              }
            }

