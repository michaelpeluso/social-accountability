name: Project Automation

# Cancel older runs for same branch to save CI minutes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  issues:
    types: [opened]
    paths-ignore: ['docs/**', 'design/**']

jobs:
  # Auto-add new issues to project (requires SOCIAL_ACCOUNTABILITY_TOKEN secret)
  add-to-project:
    runs-on: ubuntu-latest
    if: github.event_name == 'issues' && github.event.action == 'opened'
    steps:
      - name: Add issue to project
        uses: actions/add-to-project@v0.5.0
        with:
          project-url: https://github.com/users/michaelpeluso/projects/3
          github-token: ${{ secrets.SOCIAL_ACCOUNTABILITY_TOKEN }}
