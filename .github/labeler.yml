# Auto-label PRs based on changed files

# Documentation
docs/**/*:
  - documentation

# Source code by area
src/lib/**/*:
  - core
src/types/**/*:
  - types
services/**/*:
  - services
storage/**/*:
  - storage
logic/**/*:
  - logic

# Tests
tests/**/*:
  - tests

# Configuration
*.config.js:
  - config
.github/**/*:
  - ci/cd

# Milestones (based on your spec structure)
docs/spec/milestones/M0-*:
  - M0
docs/spec/milestones/M1-*:
  - M1
docs/spec/milestones/M2-*:
  - M2
docs/spec/milestones/M3-*:
  - M3
docs/spec/milestones/M4-*:
  - M4
